name: release

on:
  workflow_call:
    inputs:
      native:
        description: 'Release native image'
        default: false
        required: false
        type: boolean
      nativeMulti:
        description: 'Release multiple architectures x84, arm4, ... native image'
        default: true
        required: false
        type: boolean
      helmEventTargetRepository:
        description: 'Target repository'
        default: ''
        required: false
        type: string
      helmEventTargetBranch:
        description: 'Target branch'
        default: 'main'
        required: false
        type: string

jobs:
  docker:
    uses: onecx-apps/ci-common/.github/workflows/docker-release.yml@v3
    secrets: inherit
  native:
    if: ${{ inputs.native && !inputs.nativeMulti }}
    uses: onecx-apps/ci-quarkus/.github/workflows/quarkus-build-native.yml@v3
    secrets: inherit
    needs: [docker]
    with:
      push: true
  nativeMulti:
    if: ${{ inputs.native && inputs.nativeMulti }}
    uses: onecx-apps/ci-quarkus/.github/workflows/quarkus-build-native-multi.yml@v3
    secrets: inherit
    needs: [docker]
    with:
      push: true
  helm:
    if: |
      !cancelled()
      && needs.docker.result == 'success'
      && ( !inputs.native || needs.native.result == 'success' || needs.nativeMulti.result == 'success')
    uses: onecx-apps/ci-common/.github/workflows/helm-release.yml@v3
    needs: [docker, native, nativeMulti]
    secrets: inherit
  helm-event:
    if: |
      !cancelled()
      && needs.helm.result == 'success'
      && inputs.helmEventTargetRepository != ''
    uses: onecx-apps/ci-product/.github/workflows/helm-send-event.yml@v1
    needs: [helm]
    secrets: inherit
    with:
      targetRepository: ${{ inputs.helmEventTargetRepository }}
      targetBranch: ${{ inputs.helmEventTargetBranch }}
  changelog:
    if: |
      !cancelled()
      && needs.helm.result == 'success'
    uses: onecx-apps/ci-common/.github/workflows/generate-changelog.yml@v3
    needs: [helm]
    secrets: inherit
